name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "manager-app/renderer/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Use your own signing key if you've added one (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk RaidenSiteManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RaidenSiteManager-apk
          path: RaidenSiteManager.apk

      - name: Publish as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Site Manager for Android v1.0.${{ github.run_number }}
          body: |
            Download **RaidenSiteManager.apk** on your phone and open it to install or update.
            Built from ${{ github.sha }}.
          files: RaidenSiteManager.apk
          make_latest: true
